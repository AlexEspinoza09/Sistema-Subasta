# Configuración de Nodos para Sistema de Subasta Distribuido con Protocolo Bully
#
# Formato: id,host,puertoClientes,puertoCoordinacion
#
# - id: Identificador único del nodo (mayor ID = mayor prioridad en Bully)
# - host: Dirección IP o hostname del servidor
# - puertoClientes: Puerto para aceptar clientes de subasta
# - puertoCoordinacion: Puerto para comunicación entre servidores (protocolo Bully)
#
# IMPORTANTE: El nodo con mayor ID será elegido como coordinador inicialmente
#

# Nodo 1 - Prioridad más baja
1,localhost,8080,9080

# Nodo 2 - Prioridad media
2,localhost,8081,9081

# Nodo 3 - Prioridad más alta (será coordinador si todos están activos)
3,localhost,8082,9082

# Para despliegue en red:
# 1,192.168.1.10,8080,9080
# 2,192.168.1.11,8080,9080
# 3,192.168.1.12,8080,9080
