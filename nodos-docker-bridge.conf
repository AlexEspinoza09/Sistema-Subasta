# Configuración de Nodos para Docker con Red Bridge
# Sistema de Subasta Distribuido con Protocolo Bully
#
# IMPORTANTE: En red bridge, los contenedores usan sus hostnames
# para comunicarse entre sí dentro de Docker.
#
# Formato: id,host,puertoClientes,puertoCoordinacion

# Nodo 1 - Prioridad más baja
# Hostname dentro de Docker: nodo-bully-1
1,nodo-bully-1,8080,9080

# Nodo 2 - Prioridad media
2,nodo-bully-2,8081,9081

# Nodo 3 - Prioridad más alta (será coordinador si todos están activos)
3,nodo-bully-3,8082,9082
