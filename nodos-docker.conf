# Configuración de Nodos para Docker Compose
# Sistema de Subasta Distribuido con Protocolo Bully
#
# IMPORTANTE: Para comunicación entre contenedores usamos nombres de servicio,
# pero para clientes externos (desde el host) necesitamos usar localhost.
#
# Formato: id,host,puertoClientes,puertoCoordinacion

# Nodo 1 - Prioridad más baja
# Usar localhost para que clientes desde el host puedan conectarse
1,localhost,8080,9080

# Nodo 2 - Prioridad media
2,localhost,8081,9081

# Nodo 3 - Prioridad más alta (será coordinador si todos están activos)
3,localhost,8082,9082
